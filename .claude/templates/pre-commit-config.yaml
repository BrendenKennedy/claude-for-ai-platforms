# .pre-commit-config.yaml — enforcement on HUMAN commits.
# The scaffold's validate-python hook formats what Claude edits; it never sees a human `git commit`.
# This closes that gap. One-time setup in the target project: `uvx pre-commit install`
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.2
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout # notebooks commit clean — outputs stripped (see the notebooks skill)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks # secrets never reach a commit (guard-secrets covers the agent path; this covers yours)
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.334
    hooks:
      - id: checkov # IaC + manifest misconfiguration (guard-iac covers the agent path; this covers yours)
        args: [--quiet, --compact, --framework, terraform, kubernetes]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, relaxed]
  - repo: local
    hooks:
      - id: check-hooks
        name: guard hooks still block, allow, and fail open
        entry: python3 .claude/scripts/check-hooks.py
        language: system
        pass_filenames: false
        files: ^\.claude/hooks/
