# Production overlay. Promotion between environments is THIS FILE's digest changing — a reviewable,
# revertible PR that moves the identical artifact forward rather than rebuilding something that
# happens to share a tag (gitops skill; platform-security.md P4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: CHANGEME-namespace

resources:
  - ../../base

images:
  - name: CHANGEME-registry.example.com/CHANGEME-app
    # The exact digest that passed staging. Never a tag here.
    digest: sha256:CHANGEME

replicas:
  - name: CHANGEME-app
    count: 3

patches:
  # Production resource envelope. Guaranteed QoS (requests == limits) for latency-critical
  # inference so it is evicted last.
  - target:
      kind: Deployment
      name: CHANGEME-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: "1", memory: "2Gi" }
          limits:   { cpu: "1", memory: "2Gi" }
