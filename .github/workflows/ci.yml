name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-scaffold:
    name: Scaffold self-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck install.sh + hooks + scripts
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          # -S warning: info-level findings (e.g. SC2016 on a regex that matches a literal $HOME) don't block
          shellcheck -S warning install.sh .claude/hooks/*.sh .claude/scripts/*.sh

      - name: check-scaffold (self-consistency — the script header lists every check)
        run: .claude/scripts/check-scaffold.sh

      # The guards' own behaviour: every hook blocks what it must, allows what it must, and
      # fails OPEN on malformed input. Stdlib-only by design, so there is nothing to install.
      - name: check-hooks (guard behaviour — blocks, allows, fails open)
        run: python3 .claude/scripts/check-hooks.py
